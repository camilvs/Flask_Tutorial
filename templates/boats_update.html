<style>
    .body {
        margin: auto;
    }

    .input_field {
        width: 100%;
        padding: 12px 20px;
        margin: 8px 0;
        display: inline-block;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .input_submit {
        width: 100%;
        background-color: #4CAF50;
        color: white;
        padding: 14px 20px;
        margin: 8px 0;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    .input_submit:hover {
        background-color: #657e66;
    }
</style>

{% extends "base.html" %}

{% block body %}
    <div class="body">
        {% if error %}
            <h2>{{ error }}</h2>
        {% endif %}

        {% if success %}
            <h2>{{ success }}</h2>
        {% endif %}

        <h1>Update Boat Information</h1>

        <form action="/update" method="POST">
        
            <input type="text" name="name" class="input_field" placeholder="Name" value="{{ boat['name'] }}" required><br>
            <input type="text" name="type" class="input_field" placeholder="Type" value="{{ boat['type'] }}" required><br>
            <input type="text" name="owner_id" class="input_field" placeholder="Owner ID" value="{{ boat['owner_id'] }}" required><br>
            <input type="number" name="rental_price" class="input_field" placeholder="Rental Price" value="{{ boat['rental_price'] }}" required><br>
            <input type="submit" value="Update Boat" class="input_submit">
        </form>
        
    </div>
{% endblock %}
