{% extends "base.html" %}
{% block body %}
    <div class="boat-info-container">
        <div class="boat-info">
            <h1>Update Boat Details</h1>
            
            <form method="POST">
                <label for="name">Boat Name:</label><br>
                <input type="text" id="name" name="name" value="{{ boat['name'] }}" required><br><br>

                <label for="type">Boat Type:</label><br>
                <input type="text" id="type" name="type" value="{{ boat['type'] }}" required><br><br>

                <label for="owner_id">Owner ID:</label><br>
                <input type="text" id="owner_id" name="owner_id" value="{{ boat['owner_id'] }}" required><br><br>

                <label for="rental_price">Rental Price:</label><br>
                <input type="text" id="rental_price" name="rental_price" value="{{ boat['rental_price'] }}" required><br><br>

                <button type="submit">Update</button>
            </form>
            
            {% if error %}
                <p style="color: red;">{{ error }}</p>
            {% endif %}
        </div>
    </div>
{% endblock %}
