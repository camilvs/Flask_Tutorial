<style>
    .searchpart {
        background-color: #6e8a79;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        max-width: 400px;
        margin: 10 auto;
        text-align: center;
    }
    .input_field {
        width: 100%;
        padding: 10px;
        margin-bottom: 10px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 16px;
    }

    .searchpart button {
        padding: 10px 15px;
        background-color: #4f6156;
        color: white;
        border: none;
        border-radius: 5px;
        font-size: 16px;
        cursor: pointer;
    }
</style>



{% extends "base.html" %}
{% block body %}
<div class="searchpart">
    <form action="/search" method="GET">
        <input type="number" name="query" placeholder="Search for a by ID" class="input_field">
        <button type="submit">Search</button>
    </form>
</div>
{% endblock %}
